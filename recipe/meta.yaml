{% set name = "robotraconteur_companion_python" %}
{% set version = "0.4.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/robotraconteur/robotraconteur_companion_python/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 21f37f1024faa15993e9ee5249b50e3885581ffd02ff6ecad82ee48a7092af85

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install --no-deps --ignore-installed -vv ."

requirements:
  host:
    - python {{ python_min }}
    - robotraconteur >=0.16
    - pyyaml
    - setuptools
    - importlib_resources
    - pip
    - general_robotics_toolbox >=0.7.1
    - numpy
  run:
    - python >={{ python_min }}
    - robotraconteur >=0.16
    - pyyaml
    - setuptools
    - importlib_resources
    - general_robotics_toolbox >=0.7.1
    - numpy

test:
  requires:
    - pytest
    - python {{ python_min }}
  source_files:
    - test/
  imports:
    - pytest
  commands:
    - >-
      pytest test/ --verbose --ignore test/util/test_local_identifier_manager.py  --ignore test/util/test_infofileloader.py --ignore test/util/test_infofileloader.py --ignore test/util/test_task_generator.py

about:
  home: http://robotraconteur.com
  summary: 'Companion library for the Robot Raconteur Python core library'
  license: Apache-2.0
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - traversaro
    - johnwason
